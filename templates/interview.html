<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Copilot | Live Interview</title>

    <link rel="icon" href="{{ url_for('static', filename='assets/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>

<div class="interview-page">

    <!-- Header -->

    <header class="interview-header">

        <div class="logo">

            <img
                src="{{ url_for('static', filename='assets/logo.png') }}"
                class="logo-img"
                alt="Logo">

            AI Interview Copilot

        </div>

        <div class="timer-box">
            ⏱ <span id="timer">02:30</span>
        </div>

    </header>

    <!-- Main Layout -->

    <div class="interview-layout">

        <!-- Camera -->

        <div class="feature-card">

            <h3>📷 Live Interview</h3>

            <video
                id="video"
                autoplay
                muted
                playsinline
                class="camera-video">
            </video>

            <div class="status-row">

                <span>
                    Face:
                    <strong id="faceStatus">Waiting...</strong>
                </span>

            </div>

        </div>

        <!-- AI Panel -->

        <div class="feature-card ai-card">

            <img
                id="avatar"
                src="{{ url_for('static', filename='assets/avatar.png') }}"
                class="ai-avatar-img"
                alt="AI Avatar">

            <h2>Emma</h2>

            <p>AI Interviewer</p>

            <p id="avatarStatus">

                <span class="live-dot"></span>

                Ready for Interview

            </p>

        </div>

    </div>

    <!-- Question -->

    <div class="feature-card">

        <h3>🎯 Current Question</h3>

        <div id="currentQuestion" class="question-box">
            Click Start Interview to begin.
        </div>

        <div id="aiStatus" class="status-text">
            Waiting...
        </div>

    </div>

    <!-- Transcript -->

    <div class="feature-card">

        <h3>🎤 Live Transcript</h3>

        <div id="transcript" class="transcript-box">
            Your answer will appear here...
        </div>

    </div>

    <!-- Analytics -->

    <div class="dashboard-grid">

        <div class="feature-card metric-box eye-card">

            <h4>👀 Eye Contact</h4>

            <h2 id="eyeContact">0%</h2>

        </div>

        <div class="feature-card metric-box posture-card">

            <h4>🧍 Posture</h4>

            <h2 id="postureScore">0%</h2>

        </div>

    </div>

    <!-- Buttons -->

    <div class="button-row">

        <button id="startInterview" class="primary-btn">
            ▶ Start Interview
        </button>

        <button id="nextQuestion" class="primary-btn" style="display:none;">
            Next Question
        </button>

    </div>

</div>

<!-- Scripts -->

<script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
<script src="{{ url_for('static', filename='js/avatar.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
